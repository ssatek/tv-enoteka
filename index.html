<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TV Enotéka — Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-black: #1E1F21;
    --color-black-soft: #252729;
    --color-olive: #8CA334;
    --color-cream: #F6F3EC;
    --font-display: 'Jost', system-ui, sans-serif;
    --font-body: 'Source Sans 3', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: var(--color-black);
    font-family: var(--font-body);
  }

  #stage { position: fixed; inset: 0; }

  .slide-frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    opacity: 0;
    transition: opacity 1.1s ease;
    background: var(--color-cream);
  }
  .slide-frame.active { opacity: 1; z-index: 2; }

  /* Úvodní / chybová obrazovka, když se web nepodaří načíst nebo než naskočí první slide */
  .fallback {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2rem;
    background: var(--color-black);
    color: var(--color-cream);
    text-align: center;
    padding: 4vw;
  }
  .fallback__eyebrow {
    font-family: var(--font-display);
    font-size: clamp(0.8rem, 1.4vw, 1.1rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--color-olive);
  }
  .fallback__title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.6rem, 4vw, 3rem);
  }
  .fallback__note {
    font-size: clamp(0.9rem, 1.6vw, 1.2rem);
    opacity: 0.7;
    max-width: 60ch;
  }

  /* Diskrétní stavový pruh dole — název aktuálního slidu + hodiny */
  #statusbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.55vw 1.4vw;
    background: linear-gradient(0deg, rgba(30,31,33,0.82), rgba(30,31,33,0));
    color: var(--color-cream);
    font-family: var(--font-display);
    font-size: clamp(0.75rem, 1.1vw, 1rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #statusbar.visible { opacity: 1; }
  #statusbar .dot { color: var(--color-olive); margin: 0 0.6em; }
</style>
</head>
<body>

<div id="stage">
  <div class="fallback" id="fallback">
    <div class="fallback__eyebrow">TV Enotéka</div>
    <div class="fallback__title">Načítám program…</div>
    <div class="fallback__note">Pokud se obsah nenačte do pár vteřin, zkontroluj připojení k internetu.</div>
  </div>
</div>

<div id="statusbar">
  <span id="slide-label"></span>
  <span><span class="dot">•</span><span id="clock"></span></span>
</div>

<script>
/* =========================================================================
   KONFIGURACE ROTACE
   Uprav pořadí, URL a délku zobrazení (v sekundách) jednotlivých slidů.
   Slide typu "url" vykresluje cizí web v iframe (musí povolovat framing).
   ========================================================================= */
const SLIDES = [
  { label: 'ZWG.WINE',        url: 'https://www.zwg.wine/',                    seconds: 25 },
  { label: 'Enotéka — vinná karta', url: 'https://enoteka.vinotrh.cz/',        seconds: 25 },
  { label: 'Nápojový lístek', url: 'https://menu.vinotrh.cz/',                 seconds: 25 },
];

// Celá stránka se sama tvrdě reloadne po X hodinách běhu (prevence memory leaků na kiosk zařízení).
const AUTO_RELOAD_HOURS = 6;

// ==========================================================================

const stage = document.getElementById('stage');
const fallback = document.getElementById('fallback');
const statusbar = document.getElementById('statusbar');
const slideLabel = document.getElementById('slide-label');
const clockEl = document.getElementById('clock');

let frames = [];
let current = -1;

function buildFrames() {
  SLIDES.forEach((slide, i) => {
    const f = document.createElement('iframe');
    f.className = 'slide-frame';
    f.src = slide.url;
    f.setAttribute('title', slide.label);
    f.setAttribute('loading', i === 0 ? 'eager' : 'lazy');
    stage.appendChild(f);
    frames.push(f);
  });
}

function showSlide(index) {
  if (frames.length === 0) return;
  frames.forEach((f, i) => f.classList.toggle('active', i === index));
  fallback.style.display = 'none';
  slideLabel.textContent = SLIDES[index].label;
  statusbar.classList.add('visible');
  current = index;
}

function nextSlide() {
  const next = (current + 1) % SLIDES.length;
  showSlide(next);
  const seconds = SLIDES[next].seconds || 20;
  setTimeout(nextSlide, seconds * 1000);
}

function tickClock() {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
}

if (SLIDES.length > 0) {
  buildFrames();
  setTimeout(nextSlide, 800);
} else {
  fallback.querySelector('.fallback__title').textContent = 'Žádný obsah k zobrazení';
}

tickClock();
setInterval(tickClock, 30 * 1000);

setTimeout(() => window.location.reload(), AUTO_RELOAD_HOURS * 60 * 60 * 1000);
</script>

</body>
</html>
